[project]
name = "baduk-backend"
version = "0.1.0"
description = "Baduk Assistant backend service: KataGo Engine Manager and HTTP/WS API"
readme = "README.md"
authors = [
    { name = "Sergey Chernykh", email = "chernykh.project@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]

[project.scripts]
baduk-backend = "baduk_backend:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real KataGo binary/model (see tests/local_config.json.example)",
]
addopts = "-m \"not integration\""
testpaths = ["tests"]
